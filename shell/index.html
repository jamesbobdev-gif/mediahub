<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media Hub</title>
<meta name="viewport" content="width=1920, user-scalable=no">
<link rel="stylesheet" href="/shell/shell.css">
</head>
<body>
  <section id="view-home">
    <header class="home-header">
      <div class="brand"><span class="brand-mark"></span><h1>Media Hub</h1></div>
      <div id="home-count" class="muted">loading…</div>
      <div id="clock" class="clock"></div>
    </header>
    <div id="rows"></div>
    <footer class="hints">↑↓←→ move · Enter open · Esc back · S search · M cursor · H hide element · Space play · I stats</footer>
  </section>

  <section id="view-search" hidden>
    <div class="search-layout">
      <div class="search-panel">
        <div class="query-box"><span class="query-icon">⌕</span><div id="search-query" class="query"><span class="caret"></span></div></div>
        <div id="keyboard" class="keyboard"></div>
        <div class="muted hint">Back deletes · Back on empty returns home</div>
      </div>
      <div id="search-rows" class="search-results"></div>
    </div>
  </section>

  <section id="view-portal" hidden>
    <div id="portal-wrap"><iframe id="portal-frame" title="portal" allow="autoplay; fullscreen"></iframe></div>
  </section>

  <div id="focus-ring" hidden></div>
  <div id="cursor" hidden></div>
  <div id="osd" hidden>
    <div class="osd-row"><span class="osd-state">▶</span><span class="osd-time">0:00 / 0:00</span></div>
    <div class="osd-bar"><div class="osd-fill"></div></div>
  </div>
  <div id="toast" hidden></div>
  <pre id="hud" hidden></pre>

  <script type="module" src="/shell/js/app.js"></script>
</body>
</html>
